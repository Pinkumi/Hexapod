[project]
name = "hexavision"
version = "0.1.0"
description = "Panel web de simulación para hexápodo"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3"]

[tool.pytest.ini_options]
pythonpath = ["backend"]


[tool.setuptools]
package-dir = {"" = "backend"}

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app", "app.*"]